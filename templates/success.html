<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Message Sent | Saloni Patidar</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;

            font-family: "Inter", sans-serif;

            background:
                radial-gradient(
                    circle at 50% 35%,
                    rgba(124, 58, 237, 0.20),
                    transparent 38%
                ),
                #070711;

            color: #ffffff;
        }

        .success-wrapper {
            width: 100%;
            max-width: 560px;
            text-align: center;
        }

        .success-card {
            padding: 55px 40px;
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 24px;

            background: rgba(255, 255, 255, 0.045);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.45),
                0 0 70px rgba(124, 58, 237, 0.10);
        }

        .success-icon {
            width: 76px;
            height: 76px;
            margin: 0 auto 28px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: rgba(124, 58, 237, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.35);

            color: #c084fc;

            font-size: 34px;
        }

        .success-label {
            display: inline-block;
            margin-bottom: 18px;

            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;

            color: #a78bfa;
        }

        h1 {
            margin-bottom: 16px;

            font-size: clamp(30px, 5vw, 44px);
            line-height: 1.15;
            font-weight: 800;
        }

        h1 span {
            color: #a78bfa;
        }

        .success-message {
            max-width: 430px;
            margin: 0 auto 32px;

            color: #b7b7c8;
            font-size: 15px;
            line-height: 1.7;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;

            padding: 13px 22px;

            border-radius: 10px;

            background: #ffffff;
            color: #11111b;

            text-decoration: none;

            font-size: 14px;
            font-weight: 700;

            transition: 0.25s ease;
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.12);
        }

        .brand {
            margin-top: 25px;

            font-size: 13px;
            color: #77778a;
        }

        .brand span {
            color: #a78bfa;
        }

        @media (max-width: 500px) {

            .success-card {
                padding: 42px 24px;
            }

            .success-icon {
                width: 68px;
                height: 68px;
                font-size: 30px;
            }

            .success-message {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <main class="success-wrapper">

        <div class="success-card">

            <div class="success-icon">
                ✓
            </div>

            <span class="success-label">
                MESSAGE SENT
            </span>

            <h1>
                Thanks for <span>reaching out.</span>
            </h1>

            <p class="success-message">
                Your message has been sent successfully.
                I'll get back to you as soon as possible.
            </p>

            <a href="/" class="back-button">
                Back to Portfolio
                <span>→</span>
            </a>

        </div>

        <p class="brand">
            Saloni<span>.</span> — Python & Web Developer
        </p>

    </main>

</body>
</html>
